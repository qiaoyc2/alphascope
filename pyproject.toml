[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphascope"
version = "0.1.0"
description = "Foundation for an evidence-backed financial research agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "pandas>=2.2,<4",
    "yfinance>=0.2.66,<1",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
